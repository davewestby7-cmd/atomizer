# Atomizer settings. Copy this file to config.yaml and change what you like.
# (config.yaml is ignored by git, so your personal settings stay private.)

# Where pulled releases are saved. Relative paths are relative to the project folder.
download_dir: downloads

# Which format to pull from Ektoplazm: mp3 or flac
download_format: mp3

# Anything at or below this price (in your home currency) shows on the Cheap tab.
home_currency: AUD
cheap_threshold: 5.0

# How often sources are re-checked in the background, in hours.
# Pressing "Refresh sources" always checks right away.
refresh_hours: 6

# Google Drive sync via rclone (https://rclone.org). Leave rclone_remote empty to switch it off.
# Example: "gdrive:Atomizer" means the remote called "gdrive", folder "Atomizer".
rclone_remote: ""
# sync = make Drive an exact mirror (deleting a release here deletes it on Drive too)
# copy = only ever add files to Drive, never delete
rclone_mode: copy

sources:
  ektoplazm:
    enabled: true
    # Style pages to read (each one is https://ektoplazm.com/style/<name>)
    styles: [goa, full-on, darkpsy, forest, progressive, twilight, psycore, hi-tech,
             morning, zenonesque, techtrance, psy-dub, downtempo]
    # Country pages (https://ektoplazm.com/region/<name>). Israel first so it fills first.
    regions: [israel, india, brazil, japan, mexico, greece, russia, south-africa, australia,
              portugal, germany, united-kingdom, finland, serbia, hungary, argentina, ukraine, turkey]
    # Country pages only show thumbnails, so each new release's page is read once.
    # This caps how many new pages are read per refresh (1 per second); the rest come next time.
    max_new_per_refresh: 150

  bandcamp:
    enabled: true
    # Bandcamp tags to browse (worldwide)
    # "a+b" means releases tagged with both, e.g. psytrance+free-download
    tags: [psytrance, psychedelic-trance, goa-trance, darkpsy, forest,
           psytrance+free-download, goa-trance+free-download, darkpsy+free-download]
    # How many results to read per tag (Bandcamp returns up to 60 per page)
    per_tag: 120
    # Country scenes. geoname_id comes from geonames.org (search the country,
    # the number is in its page address). Add or remove countries freely.
    countries:
      - name: Israel
        geoname_id: 294640
        tags: [psytrance, goa-trance, progressive-psytrance, full-on, darkpsy, psychedelic-trance]
        per_tag: 60
      - name: India
        geoname_id: 1269750
        tags: [psytrance, goa-trance]
      - name: Brazil
        geoname_id: 3469034
        tags: [psytrance, darkpsy]
      - name: Japan
        geoname_id: 1861060
        tags: [psytrance]
      - name: Mexico
        geoname_id: 3996063
        tags: [psytrance]
      - name: Greece
        geoname_id: 390903
        tags: [psytrance]
      - name: South Africa
        geoname_id: 953987
        tags: [psytrance]
      - name: Australia
        geoname_id: 2077456
        tags: [psytrance]

  archive:
    # Internet Archive netlabels: Creative Commons releases from labels worldwide.
    enabled: true
    max_items: 80

  hearthis:
    # hearthis.at: free-download DJ mixes and tracks (opens the page to download)
    enabled: true
    genres: [psytrance, goa]
    pages: 2

  sonictantra:
    # Sonic Tantra (India): free dark/hi-tech/psycore compilations, direct zip downloads
    enabled: true
    max_new_per_refresh: 60

  audius:
    # Audius: full-length tracks and sets worldwide (open API, no key needed).
    # Only tracks the artist made freely downloadable can be pulled.
    enabled: true
    queries: [psytrance, goa trance, darkpsy, forest psytrance, full on psytrance, hi-tech psytrance, israel psytrance]
    per_query: 50
